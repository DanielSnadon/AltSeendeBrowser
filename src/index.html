<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'"
    />
    <title>AltSeende Browser</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <button id="brand" title="New tab" aria-label="New tab">
        <img src="../assets/eye.svg" alt="" />
      </button>
      <div class="nav-controls">
        <button
          id="back"
          data-icon="back"
          title="Back"
          aria-label="Back"
        ></button
        ><button
          id="forward"
          data-icon="forward"
          title="Forward"
          aria-label="Forward"
        ></button
        ><button
          id="reload"
          data-icon="reload"
          title="Reload"
          aria-label="Reload"
        ></button>
      </div>
      <form id="address-form">
        <button
          type="button"
          id="blocker"
          title="Ad blocker"
          aria-label="Ad blocker"
          data-icon="shield"
        ></button
        ><input
          id="address"
          aria-label="Page address or search"
          placeholder="Search or enter an address"
          autocomplete="off"
          spellcheck="false"
        />
      </form>
      <form id="findbar" hidden>
        <input
          id="find-text"
          aria-label="Find on page"
          placeholder="Find on page…"
        /><span id="find-count">0/0</span
        ><button
          type="button"
          id="find-prev"
          data-icon="up"
          title="Previous match"
          aria-label="Previous match"
        ></button
        ><button
          type="button"
          id="find-next"
          data-icon="down"
          title="Next match"
          aria-label="Next match"
        ></button
        ><button
          type="button"
          id="find-close"
          data-icon="close"
          title="Close find"
          aria-label="Close find"
        ></button>
      </form>
      <div id="tools"></div>
      <button
        id="settings"
        data-panel="settings"
        data-icon="settings"
        title="Settings"
        aria-label="Settings"
      ></button>
    </nav>
    <main id="home">
      <div class="home-wordmark">
        <img src="../assets/eye.svg" alt="" /><span>ALTSEENDE</span>
      </div>
      <h1 id="home-title">Start here.</h1>
      <p class="intro">One question. Every perspective.</p>
      <form id="home-search">
        <input
          id="home-query"
          aria-label="Search the web"
          placeholder="Search anything…"
          autocomplete="off"
        /><button
          data-icon="forward"
          title="Search"
          aria-label="Search"
        ></button>
      </form>
      <div class="search-options">
        <select id="home-engine" aria-label="Search engine"></select
        ><label
          ><input id="home-multi" type="checkbox" /> Compare Google, Yandex &
          DuckDuckGo</label
        >
      </div>
      <section id="presets-section">
        <div class="section-title">
          <h2>Your spaces</h2>
          <button
            id="edit-home"
            data-icon="edit"
            title="Customize home & presets"
            aria-label="Customize home & presets"
          ></button>
        </div>
        <div id="presets"></div>
      </section>
      <div class="home-footer">
        <span id="home-status">A quieter corner of the web.</span
        ><span>0.3 / CHROMIUM</span>
      </div>
    </main>
    <div id="pane-headers"></div>
    <section id="panel" hidden>
      <div class="panel-heading">
        <h2 id="panel-title"></h2>
        <button
          id="close-panel"
          data-icon="close"
          title="Close panel"
          aria-label="Close panel"
        ></button>
      </div>
      <div id="panel-body"></div>
    </section>
    <div id="error" hidden></div>
    <div id="toast" role="status" hidden></div>
    <footer>
      <button
        id="manage-tabs"
        data-icon="groups"
        title="Tabs & groups"
        aria-label="Tabs & groups"
      ></button>
      <div id="tabs"></div>
      <button
        id="new-tab"
        data-icon="plus"
        title="New tab (Ctrl+T)"
        aria-label="New tab"
      ></button
      ><span id="tab-count"></span>
    </footer>
    <script src="icons.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
